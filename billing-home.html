<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f3158">
  <title>請求システム 高速ホーム（調整中）</title>
  <style>
    :root{font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;color:#102d4c;background:#eef4fa}
    *{box-sizing:border-box}body{margin:0;padding:24px}.card{max-width:760px;margin:8vh auto;background:#fff;border:1px solid #d7e3ef;border-radius:18px;padding:28px;box-shadow:0 8px 28px #173b6314}
    h1{font-size:25px;margin:0 0 18px}p{font-size:17px;line-height:1.8}.notice{background:#fff5e5;border:1px solid #edcb85;border-radius:12px;padding:14px 16px}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #1769e0;border-radius:11px;padding:12px 17px;background:#1769e0;color:#fff;text-decoration:none;font-weight:700}
    .btn.secondary{background:#fff;color:#153a62;border-color:#b8cce0}@media(max-width:600px){body{padding:12px}.card{padding:20px}.btn{width:100%}}
  </style>
</head>
<body>
  <main class="card">
    <h1>高速ホームは調整中です</h1>
    <div class="notice">
      <strong>正確な請求金額を表示できないため、現在は使用を停止しています。</strong>
    </div>
    <p>請求人数・請求合計金額の確認、請求内容の作成・変更は、従来の請求管理画面をご利用ください。</p>
    <div class="actions">
      <a class="btn" href="https://script.google.com/macros/s/AKfycbxzkE1tQRyB_Ca4bfPKYWIkpTukIVPMWKf2ETE7yN7qROJk0VyOlvxaJ9GGI5p-6pGb/exec">正しい請求管理画面を開く</a>
      <a class="btn secondary" href="./#invoices">請求書・PDF配信を開く</a>
    </div>
  </main>
</body>
</html>
