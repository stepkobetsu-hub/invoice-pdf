name: Fix loading overlay final

on:
  push:
    paths:
      - '.github/workflows/fix-loading-overlay-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Disable startup blocking overlay
        shell: python
        run: |
          from pathlib import Path

          app = Path('assets/app.js')
          s = app.read_text(encoding='utf-8')
          if 'let operationOverlayCount=1;' not in s:
            raise SystemExit('operationOverlayCount target not found')
          s = s.replace('let operationOverlayCount=1;', 'let operationOverlayCount=0;', 1)
          app.write_text(s, encoding='utf-8')

          index = Path('index.html')
          h = index.read_text(encoding='utf-8')
          old = '<div id="operationOverlay" class="operation-overlay" role="status" aria-live="polite" aria-busy="true">'
          new = '<div id="operationOverlay" class="operation-overlay hidden" role="status" aria-live="polite" aria-busy="false">'
          if old not in h:
            raise SystemExit('operation overlay html target not found')
          h = h.replace(old, new, 1)
          h = h.replace('assets/app.js?v=20260811-single-number-save', 'assets/app.js?v=20260811-no-startup-overlay', 1)
          index.write_text(h, encoding='utf-8')

      - name: Syntax check
        run: node --check assets/app.js
      - name: Commit
        shell: bash
        run: |
          git config user.name 'stepkobetsu-hub'
          git config user.email 'stepkobetsu-hub@users.noreply.github.com'
          git add assets/app.js index.html
          git commit -m '起動時の読み込みオーバーレイを完全に無効化'
          git push
