name: Patch PDF download UI
on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_pdf_download_ui.py'
      - '.github/workflows/patch-pdf-download-ui.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Apply invoice production fixes
        run: python scripts/patch_pdf_download_ui.py
      - name: Verify syntax
        run: |
          git diff --check
          node --check assets/app.js
          node --check assets/receipts.js
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
      - name: Commit
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add index.html assets/app.js assets/receipts.js apps-script/Code.gs
          git commit -m "Remove remaining production send lock and align invoice UI"
          git push origin HEAD:main
