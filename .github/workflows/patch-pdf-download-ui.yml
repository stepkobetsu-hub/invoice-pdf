name: Patch PDF download UI
on:
  push:
    branches: [main]
    paths: ['scripts/patch_pdf_download_ui.py']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm ci
      - name: Apply PDF dialog and partner refresh patch
        run: python scripts/patch_pdf_download_ui.py
      - name: Verify syntax
        run: |
          git diff --check
          node --check assets/app.js
          node --check assets/receipts.js
      - name: Commit
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add index.html assets/app.js assets/receipts.js
          git commit -m "Align invoice and receipt production sending"
          git push origin HEAD:main
