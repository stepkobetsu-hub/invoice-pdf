name: Fix noauth startup load
on:
  push:
    paths: ['.github/workflows/fix-noauth-startup-load.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('assets/app.js')
          s=p.read_text()
          old='''  const initialLoad=(async()=>{\n    const token=await ensureStaffSessionToken();\n    if(token){\n      $('#userLabel').textContent='接続済み';\n      $('#staffLoginLink').classList.add('hidden');\n      return refreshAll(false);\n    }\n    $('#userLabel').textContent='未接続';\n  })();'''
          new='''  const initialLoad=(async()=>{\n    $('#userLabel').textContent='接続中';\n    $('#staffLoginLink').classList.add('hidden');\n    return refreshAll(false);\n  })();'''
          if old not in s:
              raise SystemExit('startup block not found')
          p.write_text(s.replace(old,new,1))
          h=Path('index.html')
          t=h.read_text()
          old_script='assets/app.js?v=20260811-startup-auto-auth'
          if old_script in t:
              t=t.replace(old_script,'assets/app.js?v=20260811-noauth-d1-load',1)
          else:
              import re
              t=re.sub(r"assets/app\.js\?v=[^\"']+",'assets/app.js?v=20260811-noauth-d1-load',t,count=1)
          h.write_text(t)
      - run: node --check assets/app.js
      - shell: bash
        run: |
          git config user.name stepkobetsu-hub
          git config user.email stepkobetsu-hub@users.noreply.github.com
          git add assets/app.js index.html
          git commit -m '認証解除中は起動時にD1を必ず読み込む'
          git push