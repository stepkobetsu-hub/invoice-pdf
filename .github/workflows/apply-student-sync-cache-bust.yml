name: Apply student sync cache bust

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-student-sync-cache-bust.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update receipt script cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = 'assets/receipt-pdf.js?v=20260810-receipts'
          new = 'assets/receipt-pdf.js?v=20260904-student-master-sync'
          if old not in text and new not in text:
              raise SystemExit('receipt-pdf script tag not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit cache-bust change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Bust cache for student master partner sync"
          git push
