name: Startup auto auth
on:
  push:
    paths: ['.github/workflows/startup-auto-auth.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          from pathlib import Path
          p=Path('assets/app.js'); s=p.read_text()
          old="  const initialLoad=state.settings.apiUrl&&(state.settings.adminApiKey||localStorage.getItem(STAFF_AUTH_KEY))?refreshAll(false):Promise.resolve();"
          new="  const initialLoad=(async()=>{\n    const token=await ensureStaffSessionToken();\n    if(token){\n      $('#userLabel').textContent='接続済み';\n      $('#staffLoginLink').classList.add('hidden');\n      return refreshAll(false);\n    }\n    $('#userLabel').textContent='未接続';\n  })();"
          if old not in s: raise SystemExit('startup target not found')
          p.write_text(s.replace(old,new,1))
          h=Path('index.html'); t=h.read_text().replace('assets/app.js?v=20260811-auto-reconnect','assets/app.js?v=20260811-startup-auto-auth'); h.write_text(t)
      - run: node --check assets/app.js
      - shell: bash
        run: |
          git config user.name stepkobetsu-hub
          git config user.email stepkobetsu-hub@users.noreply.github.com
          git add assets/app.js index.html
          git commit -m '起動時にスタッフ認証を自動復旧してD1を読込'
          git push