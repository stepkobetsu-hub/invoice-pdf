name: Restore Brevo batch sending
on:
  push:
    branches: [main]
    paths: ['scripts/restore_brevo_batch.py']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch PR17 reference implementation
        run: git show 4106b5d50c76665f98213550b26a392177e87d32:apps-script/Code.gs > /tmp/pr17-Code.gs
      - name: Restore Brevo batch path
        run: python scripts/restore_brevo_batch.py
      - name: Verify patch
        run: |
          git diff --check
          cp apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          grep -q "api.brevo.com/v3/smtp/email" apps-script/Code.gs
          grep -q "processBrevoQueueBatch_" apps-script/Code.gs
          ! grep -q "BREVO_ALLOW_LARGE_TEST_DELIVERY" apps-script/Code.gs
          ! grep -q "本番送信は管理者の最終承認前" apps-script/Code.gs
      - name: Commit restored production path
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add apps-script/Code.gs
          git commit -m "Restore Brevo batch production sending"
          git push origin HEAD:main
