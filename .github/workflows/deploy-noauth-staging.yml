name: Deploy no-auth staging Worker
on:
  push:
    branches: ['staging/no-auth-diagnosis']
    paths: ['.github/workflows/deploy-noauth-staging.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth only for staging
        shell: python
        run: |
          from pathlib import Path
          p=Path('cloudflare/src/index.js')
          s=p.read_text()
          old='''  const auth = await verifyStaffSession(request, env);\n  if (!auth.ok) return appJson(request, env, { ok: false, error: auth.error }, auth.status);'''
          new='''  const auth = { ok: true, user: { name: "検証モード", email: "staging@local" } };'''
          if old not in s:
              raise SystemExit('auth target not found')
          p.write_text(s.replace(old,new,1))
          w=Path('cloudflare/wrangler.jsonc')
          t=w.read_text().replace('"name": "step-invoice-api"','"name": "step-invoice-api-noauth-staging"',1)
          w.write_text(t)
      - name: Deploy staging Worker
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy
