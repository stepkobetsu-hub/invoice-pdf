name: Add central delivery failure API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-central-delivery-failures.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch worker
        run: python scripts/add-central-delivery-failures.py
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Run syntax checks
        run: npm run check
      - name: Commit endpoint
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/src/index.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Expose invoice delivery failures to central manager"
          git push
