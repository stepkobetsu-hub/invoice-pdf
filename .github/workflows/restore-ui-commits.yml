name: Restore requested UI commits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-ui-commits.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore invoice list checkboxes and bulk selection
        run: python scripts/restore_invoice_list_checkboxes.py
      - name: Verify syntax
        run: |
          git diff --check
          node --check assets/app.js
      - name: Commit restored UI
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add index.html assets/app.js assets/styles.css
          git commit -m "Restore invoice list checkboxes and bulk selection"
          git push origin HEAD:main
