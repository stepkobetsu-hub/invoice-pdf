name: Restore requested UI commits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-ui-commits.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply requested UI only
        run: python scripts/restore_requested_ui.py
      - name: Commit restored UI
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add index.html assets/app.js assets/styles.css
          git commit -m "Restore requested invoice UI and student import shortcut"
          git push origin HEAD:main
