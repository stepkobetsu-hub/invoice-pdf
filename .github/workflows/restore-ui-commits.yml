name: Restore requested UI commits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-ui-commits.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make STEP logo a real home link
        run: python scripts/fix_brand_link.py
      - name: Verify syntax
        run: |
          git diff --check
          node --check assets/app.js
      - name: Commit logo navigation fix
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add index.html assets/app.js assets/styles.css
          git commit -m "Fix STEP logo home navigation"
          git push origin HEAD:main
