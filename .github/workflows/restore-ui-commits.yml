name: Restore requested UI commits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-ui-commits.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore legacy invoice bulk-action design and behavior
        run: python scripts/restore_legacy_bulk_actions.py
      - name: Verify syntax
        run: |
          git diff --check
          node --check assets/app.js
      - name: Commit restored legacy bulk actions
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add index.html assets/app.js assets/styles.css
          git commit -m "Restore legacy invoice bulk actions"
          git push origin HEAD:main
