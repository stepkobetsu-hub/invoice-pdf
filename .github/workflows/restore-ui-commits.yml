name: Restore requested UI commits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-ui-commits.yml']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix partner master loading fallback
        run: python scripts/fix_partner_fallback.py
      - name: Verify syntax
        run: |
          git diff --check
          node --check assets/app.js
      - name: Commit partner master fix
        run: |
          git config user.name "stepkobetsu-hub"
          git config user.email "stepkobetsu@gmail.com"
          git add index.html assets/app.js
          git commit -m "Fix partner master loading fallback"
          git push origin HEAD:main
