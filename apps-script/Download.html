<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>請求書ダウンロード</title><style>body{margin:0;background:#f4f6f9;color:#172033;font-family:Meiryo,sans-serif}.card{max-width:560px;margin:8vh auto;background:#fff;border:1px solid #d8dee8;border-radius:14px;padding:32px;box-shadow:0 12px 36px #10204018}h1{font-size:24px;margin:0 0 8px;color:#172a55}.sub{color:#667085;margin-bottom:28px}.grid{display:grid;grid-template-columns:130px 1fr;gap:12px;border-top:1px solid #e4e7ec;border-bottom:1px solid #e4e7ec;padding:20px 0;margin-bottom:24px}.label{color:#667085}.button{display:block;width:100%;border:0;border-radius:8px;background:#2457a7;color:#fff;font-weight:700;font-size:16px;padding:14px;cursor:pointer}.button:disabled{opacity:.5}.note{font-size:12px;color:#667085;line-height:1.8;margin-top:22px}.status{margin-top:14px;font-size:13px}</style></head><body><main class="card"><h1>個別指導ステップ</h1><div class="sub">請求書ダウンロード</div><div class="grid"><div class="label">宛名</div><div><?= delivery.name ?></div><div class="label">対象年月</div><div><?= delivery.subject ?></div><div class="label">請求書番号</div><div><?= delivery.invoiceNumber ?></div><div class="label">請求金額</div><div><?= delivery.amount ?></div><div class="label">有効期限</div><div><?= delivery.expiresAt ?></div></div><button id="download" class="button">請求書PDFを表示・ダウンロード</button><div id="status" class="status"></div><p class="note">本ページは個別指導ステップから送付した請求書のダウンロードページです。<br>お心当たりがない場合は、ダウンロードせず個別指導ステップまでご連絡ください。<br><br>「DL済」はPDF配信処理を実行した日時を表し、端末への保存完了を保証するものではありません。</p></main><script>const token=<?!= JSON.stringify(token) ?>;document.getElementById('download').onclick=function(){const b=this,s=document.getElementById('status');b.disabled=true;s.textContent='PDFを準備しています…';google.script.run.withSuccessHandler(function(r){const bytes=Uint8Array.from(atob(r.base64),c=>c.charCodeAt(0));const blob=new Blob([bytes],{type:r.mimeType});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=r.fileName||'invoice.pdf';a.target='_blank';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);s.textContent='PDFを取得しました。';b.disabled=false;}).withFailureHandler(function(e){s.textContent=e.message||'PDFを取得できませんでした。';b.disabled=false;}).getPdfForToken(token);};</script></body></html>
